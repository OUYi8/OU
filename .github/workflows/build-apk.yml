name: 构建 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 自动定位项目根目录
        id: root
        shell: bash
        run: |
          set -e
          if [ -f "package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=""
            for f in */package.json; do
              [ -f "$f" ] && found="$(dirname "$f")" && break
            done
            if [ -z "$found" ]; then
              echo "::error::No package.json found. Did you upload the project files?"
              exit 1
            fi
            echo "dir=$found" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm ci --no-audit --no-fund

      - name: 同步到 Android
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npx cap sync android

      - name: 编译 APK
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: renovation-app-debug.apk
          path: ${{ steps.root.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
