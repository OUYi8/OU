<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="format-detection" content="telephone=no">
<title>装修管家</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-l">
      <h1 class="topbar-title" id="pageTitle">总览</h1>
      <p class="topbar-sub" id="pageSub"></p>
    </div>
    <button class="topbar-act" id="topAction" type="button"></button>
  </header>

  <main class="viewport" id="viewport"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" class="tab-ico"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>总览</span>
    </button>
    <button class="tab" data-tab="progress" type="button">
      <svg viewBox="0 0 24 24" class="tab-ico"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>
      <span>进度</span>
    </button>
    <button class="tab" data-tab="ledger" type="button">
      <svg viewBox="0 0 24 24" class="tab-ico"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm1 4v2h10V7zm0 4v2h10v-2zm0 4v2h6v-2z"/></svg>
      <span>记账</span>
    </button>
    <button class="tab" data-tab="purchase" type="button">
      <svg viewBox="0 0 24 24" class="tab-ico"><path d="M3 4h2l2.6 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2l-.6-2H3zm5 15a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span>采购</span>
    </button>
    <button class="tab" data-tab="mine" type="button">
      <svg viewBox="0 0 24 24" class="tab-ico"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.5-8 5.5V21h16v-1.5c0-3-3.6-5.5-8-5.5z"/></svg>
      <span>验收</span>
    </button>
  </nav>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-hd"><h3 id="sheetTitle"></h3><button class="sheet-x" id="sheetClose" type="button">✕</button></div>
  <div class="sheet-bd" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/photo.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/progress.js"></script>
<script src="js/pages/ledger.js"></script>
<script src="js/pages/purchase.js"></script>
<script src="js/pages/mine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
